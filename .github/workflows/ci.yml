name: CI

# The zine's central claim is that every snippet comes from code that actually
# runs. These jobs are what keep that honest.

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_VERSION: "22"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build # tsc --noEmit runs here too

  zine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Every snippet in zine.md that names a source file must still match
      # that file. This is the check that would have caught the CORS
      # middleware and the fetch URL drifting out of the prose.
      - name: Snippets match the source they claim
        run: python3 zine/check_snippets.py

      # zine.html is committed so a clone is readable without a build step;
      # this fails if someone edits zine.md and forgets to rebuild.
      # --locked pins the renderer via build.py.lock, so the check reacts to
      # your edits rather than to an unrelated Pygments release.
      - name: Committed zine.html is up to date
        run: |
          uv run --locked zine/build.py
          git diff --exit-code -- zine/zine.html
