name: CI

# The guide's central claim is that every snippet comes from code that
# actually runs. These jobs are what keep that honest.

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_VERSION: "22"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -q

      # The frontend generates its types from this file, so a route or model
      # change that isn't reflected here would silently skew the two ends.
      - name: Committed openapi.json is up to date
        run: |
          uv run python scripts/dump_openapi.py
          git diff --exit-code -- openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build # tsc --noEmit runs here too

      # src/api-types.ts is generated from the backend schema. This is the
      # check that makes the two type systems one type system.
      - name: Generated api-types.ts is up to date
        run: |
          npm run generate:types
          git diff --exit-code -- src/api-types.ts

  guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Every snippet in index.md that names a source file must still match
      # that file. This is the check that would have caught the CORS
      # middleware and the fetch URL drifting out of the prose.
      - name: Snippets match the source they claim
        run: python3 guide/check_snippets.py

      # index.html is committed so a clone is readable without a build step;
      # this fails if someone edits index.md and forgets to rebuild.
      # --locked pins the renderer via build.py.lock, so the check reacts to
      # your edits rather than to an unrelated Pygments release.
      - name: Committed index.html is up to date
        run: |
          uv run --locked guide/build.py
          git diff --exit-code -- guide/index.html
